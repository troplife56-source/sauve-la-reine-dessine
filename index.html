<style>
/* Layout: plein écran vertical, monde de jeu 400×720 mis à l'échelle, HUD collé en haut, panneaux "autocollant" centrés */
:root{
  --ink:#2b2350;
  --paper:#fffaf0;
  --sky:#86cfff;
  --gold:#ffc83d;
  --coral:#ff6b5b;
  --pink:#ff5fa2;
  --soft:#8b84b3;
  --f-ui:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-hand:"Gochi Hand","Comic Sans MS",cursive;
  color-scheme:light;
}
[hidden]{display:none!important}   /* indispensable hors de claude.ai (GitHub Pages) */
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 10px;pointer-events:none}
#hud>*{pointer-events:auto}
.icon-btn{width:44px;height:44px;flex:none;border-radius:14px;border:3px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.icon-btn svg{width:23px;height:23px}
.icon-btn:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.inkbox{flex:1;min-width:0;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:2px 9px 7px}
.inkrow{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800;font-size:14.5px;line-height:1.35}
.inkrow .lvl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pstars{display:flex;gap:1px;flex:none}
.pstars svg{width:16px;height:16px;transition:opacity .2s,transform .2s}
.pstars svg.off{opacity:.25;transform:scale(.8)}
.gauge{position:relative;height:12px;border-radius:8px;background:#e9e4f7;border:2px solid var(--ink);overflow:hidden}
#inkFill{position:absolute;inset:0 auto 0 0;width:100%;background:#6c5ce7;border-radius:5px;transition:background .2s}
.gauge i{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.45}

#timer{flex:none;width:72px;height:72px;border-radius:50%;background:var(--paper);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;pointer-events:none}
#timer.hot{background:var(--gold);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}

/* Messages en haut, sous le HUD, pour ne jamais cacher la reine */
#topstack{position:absolute;top:66px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 10px;pointer-events:none}
#hint{max-width:100%;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 2px 0 var(--ink);padding:4px 14px 2px;font-family:var(--f-hand);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#toast{background:var(--ink);color:#fff;border-radius:12px;padding:5px 12px 3px;font-weight:700;font-size:15px;white-space:nowrap;pointer-events:none}

#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,35,80,.38);padding:16px;overflow-y:auto}
.panel{width:100%;max-width:360px;background:var(--paper);border:4px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink);padding:20px 18px 22px;text-align:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1);margin:auto}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.panel h1{margin:0;font-size:36px;line-height:1;font-weight:800;text-wrap:balance}
.panel h1 .hand{display:block;font-family:var(--f-hand);font-weight:400;color:var(--coral);font-size:46px;transform:rotate(-4deg);margin-top:4px}
.panel h2{margin:0 0 6px;font-size:28px;line-height:1.1;font-weight:800;text-wrap:balance}
.panel p{margin:10px 0 0;font-size:16px;line-height:1.35;color:#4a4270}
.panel .rules{text-align:left;margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:15.5px;line-height:1.3}
.panel .rules li{display:flex;gap:8px;align-items:flex-start}
.panel .rules b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);display:grid;place-items:center;font-size:13px;line-height:1}
.actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{font-family:var(--f-ui);font-weight:800;font-size:20px;line-height:1;color:#fff;background:var(--coral);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:12px 20px 9px;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.linkbtn{margin-top:14px;background:none;border:0;font-family:var(--f-ui);font-weight:700;font-size:16px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 8px}
.bigstars{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}
.bigstars svg{width:58px;height:58px;animation:starpop .45s cubic-bezier(.3,1.8,.5,1) both}
.bigstars svg:nth-child(2){width:70px;height:70px;margin-top:-10px;animation-delay:.15s}
.bigstars svg:nth-child(3){animation-delay:.3s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
.small{font-size:14px!important;color:var(--soft)!important}

/* Carte */
.maphead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.maphead h2{margin:0;font-size:26px}
.total{display:flex;align-items:center;gap:4px;font-weight:800;font-size:18px;background:#fff3c9;border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px 0;white-space:nowrap;font-variant-numeric:tabular-nums}
.total svg{width:18px;height:18px;margin-top:-2px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.tile{position:relative;aspect-ratio:3/4;max-width:100%;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:2px 0 0;font-family:var(--f-ui);color:var(--ink)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tile .n{font-size:24px;font-weight:800;line-height:1}
.tile .st{display:flex}
.tile .st svg{width:12px;height:12px}
.tile .dz{display:flex;gap:2px;height:9px}
.tile .dz i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.dz .b{background:#ffd23f}.dz .r{background:#a39dae}.dz .c{background:#3b3550}
.tile.cur{background:#fff3c9;animation:wob 1.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-3deg)}}
.tile.done{background:#e6f8dd}
.tile.locked{background:#ddd8ee;color:var(--soft);cursor:default;box-shadow:0 3px 0 var(--soft);border-color:var(--soft)}
.tile.locked svg{width:20px;height:20px}
.legend{display:flex;justify-content:center;gap:12px;margin-top:14px;font-size:13.5px;color:#4a4270;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.dz .w{background:#3fa9f5}.dz .l{background:#ff6a1a}.dz .a{background:#c98a4b}.dz .v{background:#fff}
.mapfoot{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
/* Garde-robe */
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.wcard{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:4px 2px 6px;cursor:pointer;font-family:var(--f-ui);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.wcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.wcard:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wcard canvas{width:100%;aspect-ratio:4/5;display:block}
.wcard .nm{font-size:12.5px;font-weight:800;line-height:1.1;text-align:center;max-width:100%;overflow-wrap:anywhere}
.wcard .req{font-size:12.5px;font-weight:800;color:var(--soft);display:flex;align-items:center;gap:2px;line-height:1.2}
.wcard .req svg{width:12px;height:12px}
.wcard.on{background:#fff3c9;border-color:var(--coral);box-shadow:0 3px 0 var(--coral)}
.wcard.on .req{color:var(--coral)}
.wcard.locked{background:#ece8f6;cursor:default}
.wcard.locked canvas{filter:grayscale(1) brightness(.55) opacity(.55)}
.unlock{margin-top:12px;background:#fff3c9;border:2.5px dashed var(--ink);border-radius:14px;padding:8px 10px;font-weight:700;font-size:15.5px;line-height:1.3}
.unlock button{margin-top:6px}
/* Encres */
#inkbar{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;pointer-events:none}
#inkbar>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:4px;font-family:var(--f-ui);font-weight:800;font-size:13px;line-height:1;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 2px 0 var(--ink);padding:5px 8px 3px;cursor:pointer;white-space:nowrap}
.chip i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);margin-top:-2px;flex:none}
.chip.on{background:#fff3c9;box-shadow:0 2px 0 var(--ink),0 0 0 2.5px var(--coral)}
.chip.locked{color:var(--soft);border-color:var(--soft);box-shadow:0 2px 0 var(--soft);cursor:default}
.chip.locked svg{width:12px;height:12px;margin-top:-2px}
.chip.forced{cursor:default}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tile .x2{position:absolute;top:-8px;right:-8px;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:999px;font-size:11px;font-weight:800;line-height:1;padding:3px 5px 1px}
.dz .k{background:#ff9f43}.dz .n{background:#ffe48a}.dz .s{background:#e8344e}.dz .f{background:#b7a6ff}
.modes{display:flex;gap:4px;margin-top:12px;background:#ece8f6;border:2.5px solid var(--ink);border-radius:999px;padding:3px}
.mode{flex:1;font-family:var(--f-ui);font-weight:800;font-size:15px;line-height:1;border:0;border-radius:999px;padding:8px 0 6px;background:transparent;color:var(--ink);cursor:pointer}
.mode.on{background:var(--ink);color:#fff}
.mode.on.x{background:#6c5ce7}
.mode:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.grid.xp .tile:not(.locked){background:#efe6ff}
.grid.xp .tile.done{background:#d9ccff}
.grid.xp .tile.cur{background:#fff3c9}
.xpnote{margin:10px 0 0;font-size:14px;line-height:1.35;color:#4a3bb8;font-weight:700}
.rare{margin-top:10px;background:#efe6ff;border:2.5px solid #6c5ce7;border-radius:14px;padding:7px 10px 5px;font-weight:800;font-size:15.5px;color:#4a3bb8}
@media (prefers-reduced-motion:reduce){#hint,#timer.hot,.panel,.bigstars svg,.tile.cur{animation:none}}
</style>

/* ---------- Sauvegarde ---------- */
const SAVE_KEY = "sauveLaReineDessine.v1";
let save = {stars: {}, muted: false, costume: 0, ink: "normal", rare: {}};
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s === "object") save = Object.assign(save, s); } catch(e) {}
if (!save.stars || typeof save.stars !== "object") save.stars = {};
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e) {} }
const starsOf = i => save.stars[i + 1] || 0;
const xstarsOf = i => (save.xstars && save.xstars[i + 1]) || 0;
const unlocked = i => i === 0 || starsOf(i - 1) > 0;
const xUnlocked = i => starsOf(i) > 0;          // le mode Expert d'un niveau s'ouvre quand il est réussi en normal
const totalStars = () => LEVELS.reduce((s, _, i) => s + starsOf(i) + xstarsOf(i), 0);
const MAX_STARS = () => LEVELS.length * 6;
let expert = false;
/* Mode Expert : moins d'encre, plus de dangers, 13 s à tenir, 8 s pour dessiner,
   et une zone interdite autour de la reine (et du chat). */
/* Courbe de difficulté : plus on avance, moins d'encre, plus de dangers, plus longtemps à tenir */
function scaleLevel(base, i){
  const X = JSON.parse(JSON.stringify(base));
  const k = i / (LEVELS.length - 1);                 // 0 au niveau 1, 1 au dernier
  X.ink = Math.round(base.ink * (1 - 0.3 * k));
  X.survive = base.survive || (i >= 20 ? 12 : i >= 10 ? 11 : 10);
  if (!base.stars) X.stars = i >= 20 ? [0.22, 0.5] : i >= 10 ? [0.27, 0.58] : [0.33, 0.66];
  (X.hives || []).forEach(h => { h.count = Math.round(h.count * (1 + 0.5 * k)); h.every = Math.round(h.every * (1 - 0.2 * k)); });
  (X.cannons || []).forEach(c => { c.count += Math.floor(i / 12); c.every = Math.round(c.every * (1 - 0.2 * k)); c.speed *= 1 + 0.15 * k; });
  (X.bows || []).forEach(b => { b.count += Math.floor(i / 12); b.every = Math.round(b.every * (1 - 0.2 * k)); b.speed *= 1 + 0.15 * k; });
  (X.fluids || []).forEach(f => { f.to += Math.round(1500 * k); });
  if (X.wind) X.wind.force *= 1 + 0.3 * k;
  if (i >= 24) X.noDrawR = 50;                       // fin du jeu : petite zone interdite autour de la reine
  return X;
}
function makeExpert(base){
  const X = JSON.parse(JSON.stringify(base));
  X.expert = true;
  X.ink = Math.round(base.ink * 0.75);
  X.survive = 13;
  X.drawTime = 8000;
  X.noDrawR = 62;
  X.stars = [0.2, 0.5];
  (X.hives || []).forEach(h => { h.count = Math.ceil(h.count * 1.4); h.every = Math.round(h.every * 0.85); });
  (X.cannons || []).forEach(c => { c.count += 2; c.every = Math.round(c.every * 0.85); });
  (X.bows || []).forEach(b => { b.count += 2; b.every = Math.round(b.every * 0.85); });
  (X.fluids || []).forEach(f => { f.to += 2500; f.rate = Math.round(f.rate * 0.85); });
  if (X.wind) X.wind.force *= 1.3;
  return X;
}
const costumeOpen = i => totalStars() >= COSTUMES[i].need;
if (!save.rare || typeof save.rare !== "object") save.rare = {};
if (!save.xstars || typeof save.xstars !== "object") save.xstars = {};
expert = !!save.expertMode;

const Snd = {
  ctx: null, master: null, buzz: null, noise: null,
  init(){
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain();
      this.master.gain.value = save.muted ? 0 : 0.9; this.master.connect(this.ctx.destination);
      const n = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.6, this.ctx.sampleRate), d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noise = n;
    } catch(e) { this.ctx = null; }
  },
  setMuted(m){ if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.02); },
  tone(f, dur, type="sine", vol=0.15, f2=null, delay=0){
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  boom(){
    if (!this.ctx || !this.noise) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = "lowpass"; f.frequency.setValueAtTime(1400, t); f.frequency.exponentialRampToValueAtTime(120, t + 0.5);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + 0.6);
    this.tone(110, 0.35, "sine", 0.3, 45);
  },
  thud(v){
    if (!this.ctx || !this.noise) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = "lowpass"; f.frequency.value = 320;
    g.gain.setValueAtTime(Math.min(0.45, v * 0.06), t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + 0.2);
    this.tone(95, 0.15, "sine", Math.min(0.25, v * 0.035), 50);
  },
  noiseHit(dur, type, freq, vol, delay=0){
    if (!this.ctx || !this.noise) return;
    const c = this.ctx, t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + Math.min(0.6, dur + 0.05));
  },
  twang(){ this.tone(230, 0.22, "triangle", 0.16, 95); this.noiseHit(0.08, "highpass", 3000, 0.08); },
  crack(){ this.noiseHit(0.25, "bandpass", 1800, 0.35); this.tone(260, 0.25, "square", 0.06, 70); },
  splash(){ this.noiseHit(0.5, "bandpass", 900, 0.45); this.tone(600, 0.25, "sine", 0.1, 200, 0.05); },
  sizzle(){ this.noiseHit(0.6, "highpass", 2500, 0.3); this.noiseHit(0.5, "highpass", 4000, 0.2, 0.25); },
  pop(){ this.tone(180, 0.12, "square", 0.08, 520); this.noiseHit(0.15, "bandpass", 1200, 0.25); },
  whistle(){ this.tone(1400, 0.6, "sine", 0.06, 420); },
  poof(){ this.noiseHit(0.4, "bandpass", 2200, 0.25); this.tone(900, 0.3, "sine", 0.06, 1800); },
  boing(){ this.tone(260, 0.2, "sine", 0.16, 720); },
  squish(){ this.noiseHit(0.16, "lowpass", 700, 0.3); this.tone(180, 0.14, "sine", 0.12, 80); },
  bzz(){ this.tone(330, 0.07, "sawtooth", 0.035, 240); },
  eek(){ this.tone(950, 0.14, "sine", 0.11, 1600); this.tone(1500, 0.14, "sine", 0.09, 1100, 0.13); },
  youpi(){ this.tone(700, 0.12, "triangle", 0.13, 1050); this.tone(880, 0.22, "triangle", 0.13, 1500, 0.14); },
  clink(){ this.tone(2100, 0.12, "triangle", 0.07, 1800); this.tone(3150, 0.08, "sine", 0.04); },
  scribble(){ this.tone(700 + Math.random()*500, 0.035, "triangle", 0.035); },
  bonk(){ this.tone(170, 0.16, "square", 0.07, 90); },
  drop(){ this.tone(320, 0.14, "sine", 0.18, 110); },
  tick(){ this.tone(980, 0.08, "sine", 0.12); },
  click(){ this.tone(660, 0.06, "triangle", 0.1, 880); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=>this.tone(f, 0.22, "triangle", 0.14, null, i*0.1)); this.tone(1568,0.5,"sine",0.08,null,0.55); },
  ouch(){ this.tone(900, 0.12, "square", 0.06, 1400); this.tone(520, 0.5, "sawtooth", 0.07, 140, 0.1); this.tone(220, 0.35, "sine", 0.16, 440, 0.55); this.tone(440,0.4,"sine",0.12,160,0.8); },
  startBuzz(){
    if (!this.ctx || this.buzz) return;
    const c = this.ctx, g = c.createGain(), lp = c.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 900; g.gain.value = 0;
    const o1 = c.createOscillator(), o2 = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain();
    o1.type = "sawtooth"; o2.type = "sawtooth"; o1.frequency.value = 205; o2.frequency.value = 213;
    lfo.frequency.value = 7; lg.gain.value = 12; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.master);
    o1.start(); o2.start(); lfo.start();
    this.buzz = {g, nodes:[o1,o2,lfo]};
  },
  buzzLevel(v){ if (this.buzz) this.buzz.g.gain.setTargetAtTime(v, this.ctx.currentTime, 0.1); },
  stopBuzz(){
    if (!this.buzz) return; const b = this.buzz; this.buzz = null;
    b.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.15);
    setTimeout(()=>b.nodes.forEach(n=>{ try{n.stop()}catch(e){} }), 800);
  }
};

const overlay = $("overlay"), timerEl = $("timer"), hintEl = $("hint"), toastEl = $("toast"), hud = $("hud");
const inkFill = $("inkFill"), pstars = $("pstars"), btnSound = $("btnSound");

/* ---------- État ---------- */
let cur = 0, L = LEVELS[0];
let engine, queen, blockers, plats, hives, rocks, cannons, balls, bees;
let emitters = [], fluids = [], bows = [], arrows = [], pendingStick = [];
let anchors = [], drops = [], constraints = [], anchorFlash = 0;
let lines = [], strokesLeft = 1, strokeStartInk = 0, ghostNow = [], pet = null, bounceQ = [], inkType = "normal", lastBoing = 0;
let state = "title";           // title | map | wardrobe | draw | play | win | fail
let pts = [], drawing = false, inkUsed = 0, blockMark = null, scribbleAcc = 0;
let simT = 0, lastSecond = 99, endT = 0, shake = 0;
let confetti = [], smoke = [], bubble = null, t = 0;
let timeScale = 1, slowUntil = 0, pows = [], dust = [], crownFly = null, lean = 0;
let lastEek = 0, lastThud = 0, lastBzz = 0, prevMood = "calm";
const ghosts = {};   // dernier trait tenté sur chaque niveau
let view = {s:1, ox:0, oy:0, cw:0, ch:0, dpr:1};

function buildLevel(i){
  cur = i;
  const B = scaleLevel(LEVELS[i], i);
  L = expert ? makeExpert(B) : B;
  engine = Engine.create({positionIterations: 8, velocityIterations: 6});
  const ground = Bodies.rectangle(W/2, GROUND + 60, 1400, 120, {isStatic:true, label:"ground", friction:1, collisionFilter:{category:CAT_WORLD}});
  queen = Bodies.rectangle(L.queen.x, L.queen.y - 42, 46, 84, {isStatic:true, label:"queen", chamfer:{radius:16}, collisionFilter:{category:CAT_WORLD}});
  plats = (L.platforms || []).map(p => {
    const b = Bodies.rectangle(p.x, p.y, p.w, p.h, {isStatic: !p.breakAt, angle: p.a || 0, label:"plat", friction:0.9, density:0.002, collisionFilter:{category:CAT_WORLD}});
    if (p.breakAt) Body.setStatic(b, true);   // pont fragile : statique jusqu'à la casse
    b.def = p; return b;
  });
  hives = (L.hives || []).map(h => ({
    ...h, spawned: 0,
    side: h.x > L.queen.x ? -1 : 1,
    mouth: {x: h.x + (h.x > L.queen.x ? -14 : 14), y: h.y + 30},
    body: Bodies.rectangle(h.x, h.y, 66, 84, {isStatic:true, label:"hive", chamfer:{radius:28}, collisionFilter:{category:CAT_HIVE, mask:CAT_LINE}})
  }));
  rocks = (L.rocks || []).map((r, k) => {
    const b = Bodies.polygon(r.x, r.y, 8, r.r, {label:"rock", density:0.004, friction:0.6, frictionAir:0.004, restitution:0.1,
      collisionFilter:{category:CAT_ROCK, mask:CAT_WORLD | CAT_LINE | CAT_ROCK | CAT_BEE | CAT_LIQ}});
    Body.setAngle(b, k * 0.7); b.seed = k; return b;
  });
  const qc = {x: L.queen.x, y: L.queen.y - 60}; // visent la tête
  cannons = (L.cannons || []).map(c => {
    const pivot = {x: c.x, y: c.y - 24};
    const ang = Math.atan2(qc.y - pivot.y, qc.x - pivot.x);
    return {...c, pivot, ang, fired: 0, recoil: 0,
      body: Bodies.circle(pivot.x, pivot.y + 6, 24, {isStatic:true, label:"cannon", collisionFilter:{category:CAT_WORLD}})};
  });
  emitters = (L.fluids || []).map(f => {
    const len = f.dir > 0 ? f.x + 40 : W - f.x + 40, cx = f.dir > 0 ? f.x - len/2 : f.x + len/2;
    return {...f, n: 0, body: Bodies.rectangle(cx, f.y, len, 24, {isStatic:true, label:"pipe", collisionFilter:{category:CAT_WORLD}})};
  });
  bows = (L.bows || []).map(b => {
    const pivot = {x: b.x, y: b.y - 36};
    return {...b, pivot, ang: Math.atan2(qc.y - pivot.y, qc.x - pivot.x), fired: 0,
      body: Bodies.circle(pivot.x, pivot.y + 8, 18, {isStatic:true, label:"bow", collisionFilter:{category:CAT_WORLD}})};
  });
  cannons.forEach(c => c.ang0 = c.ang);
  hives.forEach(h => h.x0 = h.x);
  bows.forEach(b => b.x0 = b.x);
  pet = L.pet ? Bodies.rectangle(L.pet.x, L.pet.y - 24, 38, 48, {isStatic:true, label:"pet", chamfer:{radius:10}, collisionFilter:{category:CAT_WORLD}}) : null;
  cannons.forEach(c => c.hidden = !!c.appear);
  bows.forEach(b => b.hidden = !!b.appear);
  anchors = (L.anchors || []).map(a => ({...a, line: null}));
  drops = (L.drops || []).map(d => ({...d, done: false}));
  constraints = []; anchorFlash = 0;
  blockers = [ground, queen, ...(pet ? [pet] : []), ...plats, ...hives.map(h => h.body), ...rocks,
    ...cannons.filter(c => !c.hidden).map(c => c.body), ...emitters.map(e => e.body), ...bows.filter(b => !b.hidden).map(b => b.body)];
  Composite.add(engine.world, blockers);
  Events.on(engine, "collisionStart", ev => {
    for (const p of ev.pairs) {
      const A = p.bodyA.parent || p.bodyA, B = p.bodyB.parent || p.bodyB;
      if (A.label === "ball") A.hit = true;
      if (B.label === "ball") B.hit = true;
      if (A.label === "arrow" || B.label === "arrow") {
        const ar = A.label === "arrow" ? A : B, o = ar === A ? B : A;
        if (!ar.hit && o.label !== "water" && o.label !== "lava" && o.ink !== "bouncy") { ar.hit = true; pendingStick.push({ar, o}); }
      }
      for (const [ln, o] of [[A, B], [B, A]]) {
        if (ln.label !== "line") continue;
        if (ln.ink === "sticky" && state === "play" && !ln.isStatic && o.isStatic && o !== queen && o !== pet) ln.glue = true;
        if (ln.ink === "bouncy" && (o.label === "ball" || o.label === "rock" || o.label === "bee" || o.label === "arrow"))
          bounceQ.push({o, v: {x: o.velocity.x, y: o.velocity.y}, n: p.collision.normal});
      }
      impactFx(A, B, p);
      if (state !== "play") continue;
      const tgt = (A === queen || A === pet) ? A : (B === queen || B === pet) ? B : null;
      const other = tgt === A ? B : A;
      if (tgt && DANGER.has(other.label)) { failBy = other.label; failWho = tgt === pet ? "pet" : "queen"; lose(other); break; }
    }
  });
  fluids = []; arrows = []; pendingStick = []; bounceQ = []; floaters = [];
  lines = []; strokesLeft = L.strokes || 1; strokeStartInk = 0; ghostNow = []; failWho = "queen"; winStyle = "normal";
  bees = []; balls = []; pts = []; drawing = false; inkUsed = 0;
  simT = 0; lastSecond = 99; confetti = []; smoke = []; blockMark = null; shake = 0;
  pows = []; dust = []; crownFly = null; lean = 0; timeScale = 1;
  bubble = {text: "Au secours !", until: t + 2.6};
}

/* Effets d'impact : poussière, bruit sourd, secousse */
function impactFx(A, B, p){
  const isHeavy = b => b.label === "rock" || b.label === "ball";
  const heavy = isHeavy(A) ? A : isHeavy(B) ? B : null;
  if (heavy) {
    const o = heavy === A ? B : A;
    if (o === queen) return;
    const ov = o.velocity || {x: 0, y: 0};
    const rv = Math.hypot(heavy.velocity.x - ov.x, heavy.velocity.y - ov.y);
    if (rv > 2.2) {
      const sup = p.collision && p.collision.supports && p.collision.supports[0];
      const at = sup ? {x: sup.x, y: sup.y} : heavy.position;
      if (t - lastThud > 0.07) { lastThud = t; Snd.thud(rv); }
      puff(at.x, at.y, Math.min(10, (3 + rv) | 0), o.label === "line" ? "#d8d2ec" : "#e6d2b5");
      if (rv > 4.5) shake = Math.max(shake, rv * 0.8);
    }
  } else if ((A.label === "bee" && B.label === "line") || (B.label === "bee" && A.label === "line")) {
    if (t - lastBzz > 0.12) { lastBzz = t; Snd.bzz(); }
  }
}
function puff(x, y, n, col){
  for (let k = 0; k < n; k++) dust.push({x, y, vx: (Math.random() - .5) * 3, vy: -Math.random() * 2.2, r: 3 + Math.random() * 4, life: 1, col});
}

function startLevel(i){
  Snd.stopBuzz();
  buildLevel(i);
  state = "draw";
  overlay.hidden = true; overlay.innerHTML = "";
  hud.hidden = false;
  timerEl.hidden = true; timerEl.classList.remove("hot");
  hintEl.textContent = L.tip || "Dessine UN trait pour la protéger !";
  hintEl.hidden = false;
  $("lvlName").textContent = (expert ? "Expert · " : "") + (cur + 1) + ". " + L.name;
  inkType = L.inkType || (inkOpen(save.ink) ? save.ink : "normal");
  drawLeft = L.drawTime || 0; lastDrawSec = 99;
  if (L.drawTime) { hintEl.textContent = "Vite ! 8 secondes pour dessiner"; }
  showInkBar();
  updateInkUI();
}
function showInkBar(){
  const bar = $("inkbar");
  if (state !== "draw" || drawing || lines.length) { bar.hidden = true; return; }
  let html;
  if (L.inkType) {
    const I = INKS[L.inkType];
    html = `<span class="chip forced on"><i style="background:${I.col}"></i>Encre imposée : ${I.name}</span>`;
  } else {
    if (!INK_ORDER.some((k, i) => i > 0 && inkOpen(k))) { bar.hidden = true; return; }
    html = INK_ORDER.filter(k => !INKS[k].imposedOnly).map(k => {
      const I = INKS[k];
      if (!inkOpen(k)) return `<button class="chip locked" disabled aria-label="Encre ${I.name}, ${I.need} étoiles nécessaires">${LOCK}${starSvg(true, 2)}${I.need}</button>`;
      return `<button class="chip ${k === inkType ? "on" : ""}" data-ink="${k}"><i style="background:${I.col}"></i>${I.name}</button>`;
    }).join("");
  }
  bar.innerHTML = html; bar.hidden = false;
  bar.querySelectorAll("[data-ink]").forEach(b => b.onclick = () => { inkType = b.dataset.ink; save.ink = inkType; persist(); Snd.click(); showInkBar(); });
}

/* ---------- Encre ---------- */
const cuts = () => L.stars || [0.33, 0.66];
function starsFor(used){ const f = used / L.ink, c = cuts(); return f < c[0] ? 3 : f < c[1] ? 2 : 1; }
function updateInkUI(){
  const rem = Math.max(0, 1 - inkUsed / L.ink);
  inkFill.style.width = (rem * 100) + "%";
  const c = cuts(), ticks = document.querySelectorAll(".gauge i");
  if (ticks.length === 2) { ticks[0].style.left = ((1 - c[1]) * 100) + "%"; ticks[1].style.left = ((1 - c[0]) * 100) + "%"; }
  inkFill.style.background = rem > 1 - c[0] ? "#6c5ce7" : rem > 1 - c[1] ? "#ff9f43" : "#ff5e57";
  const n = starsFor(inkUsed);
  pstars.innerHTML = starSvg(true) + starSvg(n >= 2) + starSvg(n >= 3);
}

/* ---------- Dessin du trait ---------- */
function toWorld(e){
  const r = cv.getBoundingClientRect();
  return {x: (e.clientX - r.left - view.ox) / view.s, y: (e.clientY - r.top - view.oy) / view.s};
}
function noDrawZones(){
  if (!L.noDrawR) return [];
  const z = [{x: L.queen.x, y: L.queen.y - 44}];
  if (L.pet) z.push({x: L.pet.x, y: L.pet.y - 26});
  return z;
}
function segDist(p, a, b){
  const vx = b.x - a.x, vy = b.y - a.y, l2 = vx*vx + vy*vy;
  const k = l2 ? Math.max(0, Math.min(1, ((p.x - a.x) * vx + (p.y - a.y) * vy) / l2)) : 0;
  return Math.hypot(a.x + vx*k - p.x, a.y + vy*k - p.y);
}
function isBlocked(a, b){
  for (const z of noDrawZones()) if (segDist(z, a, b) < L.noDrawR + LINE_W / 2) return true;
  const dx = b.x - a.x, dy = b.y - a.y;
  if (dx*dx + dy*dy < 0.01) b = {x: a.x + 0.2, y: a.y};
  return Query.ray(blockers, a, b, LINE_W + 2).length > 0;
}
function markBlock(p){ blockMark = {x:p.x, y:p.y, until: t + 0.7}; Snd.bonk(); }

function extendTo(p){
  p = {x: Math.max(-30, Math.min(W+30, p.x)), y: Math.max(-60, p.y)};
  let last = pts[pts.length - 1];
  let dx = p.x - last.x, dy = p.y - last.y, d = Math.hypot(dx, dy);
  if (d < MIN_SEG) return;
  while (d >= MIN_SEG) {
    let len = Math.min(MAX_SEG, d);
    const left = L.ink - inkUsed;
    let out = false;
    if (len > left) { len = left; out = true; }
    if (len < 1) { stopDrawing("Plus d'encre !"); return; }
    const q = {x: last.x + dx/d*len, y: last.y + dy/d*len};
    if (isBlocked(last, q)) { markBlock(q); stopDrawing(null); return; }
    pts.push(q); inkUsed += len; last = q;
    scribbleAcc += len; if (scribbleAcc > 22) { scribbleAcc = 0; Snd.scribble(); }
    if (out) { stopDrawing("Plus d'encre !"); return; }
    dx = p.x - last.x; dy = p.y - last.y; d = Math.hypot(dx, dy);
  }
  updateInkUI();
}
function stopDrawing(msg){ updateInkUI(); if (msg) toast(msg); drawing = false; finishLine(); }

cv.addEventListener("pointerdown", e => {
  Snd.init();
  if (state !== "draw" || drawing || strokesLeft <= 0) return;
  const p = toWorld(e);
  if (isBlocked(p, p)) { markBlock(p); return; }
  drawing = true; pts = [p]; strokeStartInk = inkUsed; scribbleAcc = 0;
  hintEl.hidden = true; bubble = null; $("inkbar").hidden = true;
  try { cv.setPointerCapture(e.pointerId); } catch(_) {}
});
cv.addEventListener("pointermove", e => {
  if (!drawing) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ce of (list.length ? list : [e])) { if (!drawing) break; extendTo(toWorld(ce)); }
});
const endPointer = () => { if (drawing) { drawing = false; finishLine(); } };
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);

function touchesAnchor(a, list){
  for (let i = 0; i < list.length - 1; i++) if (segDist(a, list[i], list[i + 1]) < 16) return true;
  return false;
}
function finishLine(forced){
  if (state !== "draw" || strokesLeft <= 0) return;
  if (inkUsed - strokeStartInk < 24 || pts.length < 2) {
    pts = []; inkUsed = strokeStartInk; updateInkUI(); hintEl.hidden = false; showInkBar();
    toast("Trace un trait un peu plus long"); return;
  }
  const hits = anchors.filter(a => !a.line && touchesAnchor(a, pts));
  if (!forced && strokesLeft === 1 && anchors.some(a => !a.line && !hits.includes(a))) {
    pts = []; inkUsed = strokeStartInk; updateInkUI(); hintEl.hidden = false; showInkBar();
    anchorFlash = t + 1.2; Snd.bonk();
    toast(anchors.length > 1 ? "Ton trait doit passer par tous les clous" : "Ton trait doit passer par le clou doré"); return;
  }
  const I = INKS[inkType] || INKS.normal;
  const opt = {density: I.density, friction: I.friction, frictionStatic: 1, restitution: I.restitution};
  const parts = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i+1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    parts.push(Bodies.rectangle((a.x+b.x)/2, (a.y+b.y)/2, len + LINE_W*0.6, LINE_W, Object.assign({angle: Math.atan2(b.y-a.y, b.x-a.x)}, opt)));
  }
  const body = parts.length === 1 ? parts[0] : Body.create(Object.assign({parts}, opt));
  body.label = "line"; body.ink = inkType;
  body.collisionFilter = {category: CAT_LINE, mask: CAT_WORLD | CAT_LINE | CAT_BEE | CAT_HIVE | CAT_ROCK | CAT_LIQ, group: 0};
  parts.forEach(p => { p.collisionFilter = body.collisionFilter; p.label = "line"; p.ink = inkType; });
  lines.push({body, a0: body.angle, pts: pts.map(p => ({x: p.x - body.position.x, y: p.y - body.position.y})), stuck: []});
  Composite.add(engine.world, body);
  for (const a of hits) {   // le trait est cloué : il peut tourner autour du clou
    a.line = body;
    const c = Constraint.create({pointA: {x: a.x, y: a.y}, bodyB: body, pointB: {x: a.x - body.position.x, y: a.y - body.position.y}, length: 0, stiffness: 0.9, damping: 0.1});
    Composite.add(engine.world, c); constraints.push(c);
  }
  if (hits.length) Snd.clink();
  ghostNow.push(pts.slice());
  pts = [];
  strokesLeft--;
  if (strokesLeft > 0) {          // il reste un trait : le premier attend, figé
    blockers.push(body);
    Snd.drop();
    hintEl.textContent = `Trait ${L.strokes - strokesLeft + 1} sur ${L.strokes}`; hintEl.hidden = false;
    return;
  }
  beginPlay();
}
function beginPlay(){
  ghosts[cur] = ghostNow; pts = []; drawing = false; strokesLeft = 0;
  state = "play"; simT = 0; lastSecond = 99;
  timerEl.hidden = false; timerEl.classList.remove("hot"); timerEl.textContent = L.survive || 10;
  $("inkbar").hidden = true; hintEl.hidden = true;
  Snd.drop();
  if (hives.length) Snd.startBuzz();
  bubble = {text: lines.length ? "Oh non…" : "Hé ! Et mon mur ?", until: t + 1.6};
}
// Expert : temps limité pour dessiner
let drawLeft = 0, lastDrawSec = 99;
function tickDrawClock(dt){
  if (state !== "draw" || !L.drawTime) return;
  drawLeft -= dt;
  const sec = Math.max(0, Math.ceil(drawLeft / 1000));
  if (sec !== lastDrawSec) {
    lastDrawSec = sec; timerEl.textContent = sec; timerEl.hidden = false;
    timerEl.classList.toggle("hot", sec <= 3);
    if (sec <= 3 && sec > 0) Snd.tick();
  }
  if (drawLeft <= 0) {
    if (drawing) { drawing = false; finishLine(true); }
    if (state === "draw") { if (!lines.length) toast("Temps écoulé !"); beginPlay(); }
  }
}

/* ---------- Dangers ---------- */
function spawnBee(h){
  const b = Bodies.circle(h.mouth.x + (Math.random()*8-4), h.mouth.y, 8, {
    label: "bee", density: 0.004, frictionAir: 0.02, friction: 0.05, restitution: 0.3,
    collisionFilter: {category: CAT_BEE, mask: CAT_WORLD | CAT_LINE | CAT_BEE | CAT_ROCK}
  });
  Body.setInertia(b, Infinity);
  Body.setVelocity(b, {x: h.side * (1.5 + Math.random()), y: 1 + Math.random()});
  Composite.add(engine.world, b);
  bees.push({body: b, phase: Math.random()*10, face: h.side, target: pet && Math.random() < 0.4 ? pet : queen});
}
function fireCannon(c){
  const dx = Math.cos(c.ang), dy = Math.sin(c.ang);
  const b = Bodies.circle(c.pivot.x + dx*46, c.pivot.y + dy*46, 9, {
    label: "ball", density: 0.012, frictionAir: 0, friction: 0.2, restitution: 0.35,
    collisionFilter: {category: CAT_ROCK, mask: CAT_WORLD | CAT_LINE | CAT_ROCK | CAT_BEE | CAT_LIQ}
  });
  Body.setVelocity(b, {x: dx * c.speed, y: dy * c.speed});
  Composite.add(engine.world, b);
  balls.push(b);
  c.recoil = 1; Snd.boom(); shake = Math.max(shake, 4);
  for (let k = 0; k < 9; k++) smoke.push({x: c.pivot.x + dx*44, y: c.pivot.y + dy*44,
    vx: dx * (1 + Math.random()*1.5) + (Math.random()-.5), vy: dy * (1 + Math.random()*1.5) + (Math.random()-.5) - 0.3,
    r: 6 + Math.random()*6, life: 1});
}
function fireBow(b){
  const dx = Math.cos(b.ang), dy = Math.sin(b.ang);
  const ar = Bodies.rectangle(b.pivot.x + dx*44, b.pivot.y + dy*44, 30, 4, {label:"arrow", angle: b.ang, density:0.004, frictionAir:0, friction:0.5,
    collisionFilter:{category:CAT_ROCK, mask:CAT_WORLD | CAT_LINE | CAT_ROCK}});
  Body.setInertia(ar, Infinity);
  Body.setVelocity(ar, {x: dx * b.speed, y: dy * b.speed});
  Composite.add(engine.world, ar); arrows.push(ar);
  Snd.twang();
}
function emitFluid(e){
  const lava = e.kind === "lava";
  const d = Bodies.circle(e.x + e.dir*6, e.y + (Math.random()*6 - 3), 5.5, {label: e.kind, density: lava ? 0.002 : 0.0015,
    friction: lava ? 0.05 : 0, frictionStatic: 0, frictionAir: 0.008, restitution: 0.05,
    collisionFilter:{category:CAT_LIQ, mask:CAT_WORLD | CAT_LINE | CAT_LIQ | CAT_ROCK}});
  Body.setVelocity(d, {x: e.dir * (e.speed + Math.random()*0.6), y: Math.random()*0.6});
  Composite.add(engine.world, d); fluids.push(d);
  if (fluids.length > 170) { Composite.remove(engine.world, fluids[0]); fluids.shift(); }
}
// une flèche qui touche le trait s'y plante et suit ses mouvements
function processStick(){
  for (const {ar, o} of pendingStick) {
    const i = arrows.indexOf(ar); if (i < 0) continue;
    const ln = o.label === "line" ? lines.find(l => l.body === o) : null;
    if (ln) {
      const lb = ln.body, dx = ar.position.x - lb.position.x, dy = ar.position.y - lb.position.y;
      const c = Math.cos(-lb.angle), s = Math.sin(-lb.angle);
      ln.stuck.push({x: dx*c - dy*s, y: dx*s + dy*c, a: ar.angle - lb.angle});
      Composite.remove(engine.world, ar); arrows.splice(i, 1);
    } else if (o.isStatic) Body.setStatic(ar, true);
  }
  pendingStick = [];
  // encre rebondissante : renvoie ce qui la frappe
  for (const {o, v, n} of bounceQ) {
    const d = v.x * n.x + v.y * n.y; if (Math.abs(d) < 0.6) continue;
    Body.setVelocity(o, {x: (v.x - 2 * d * n.x) * 1.08, y: (v.y - 2 * d * n.y) * 1.08});
    if (o.label === "ball" || o.label === "arrow") o.hit = true;
    if (t - lastBoing > 0.08) { lastBoing = t; Snd.boing(); }
  }
  bounceQ = [];
  // encre collante : se fige au premier contact avec quelque chose d'immobile
  for (const l of lines) if (l.body.glue && !l.body.isStatic) {
    l.body.glue = false; Body.setStatic(l.body, true); Snd.squish(); puff(l.body.position.x, l.body.position.y, 6, "#ffd27a");
  }
}
const windNow = () => !L.wind ? 0 : L.wind.force * (L.wind.gust ? 0.55 + 0.45 * Math.sin(simT * 0.0016) : 1);

function steer(){
  const g = engine.gravity.y * engine.gravity.scale;
  const fleeing = state === "win";
  for (const bee of bees) {
    const B = bee.body;
    const T = bee.target || queen;
    let tx = T.position.x, ty = T.position.y - 8;
    if (fleeing) { tx = B.position.x + (B.position.x < W/2 ? -260 : 260); ty = -300; }
    let dx = tx - B.position.x, dy = ty - B.position.y; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = Math.sin(simT * 0.006 + bee.phase) * 0.65;
    const k = BEE_ACC * B.mass * (fleeing ? 1.6 : 1);
    Body.applyForce(B, B.position, {x: (dx - dy*w) * k, y: (dy + dx*w) * k - g * B.mass});
  }
  // les boulets volent droit tant qu'ils n'ont rien touché
  for (const b of balls) if (!b.hit) Body.applyForce(b, b.position, {x: 0, y: -g * b.mass});
  for (const a of arrows) if (!a.hit && !a.isStatic) Body.applyForce(a, a.position, {x: 0, y: -g * a.mass});
  const w = windNow();
  if (w && state !== "win") {
    for (const l of lines) if (!l.body.isStatic) Body.applyForce(l.body, l.body.position, {x: w * l.body.mass, y: 0});
    for (const r of rocks) Body.applyForce(r, r.position, {x: w * 0.5 * r.mass, y: 0});
    for (const f of fluids) Body.applyForce(f, f.position, {x: w * 0.8 * f.mass, y: 0});
  }
}
function cleanup(){
  const cap = state === "win" ? 6 : BEE_MAX;
  for (let i = bees.length - 1; i >= 0; i--) {
    const B = bees[i].body, v = B.velocity, sp = Math.hypot(v.x, v.y);
    if (sp > cap) Body.setVelocity(B, {x: v.x/sp*cap, y: v.y/sp*cap});
    if (Math.abs(B.velocity.x) > 0.3) bees[i].face += ((B.velocity.x > 0 ? 1 : -1) - bees[i].face) * 0.25;
    if (out(B.position)) { Composite.remove(engine.world, B); bees.splice(i, 1); }
  }
  for (let i = balls.length - 1; i >= 0; i--) if (out(balls[i].position)) { Composite.remove(engine.world, balls[i]); balls.splice(i, 1); }
  for (let i = rocks.length - 1; i >= 0; i--) if (out(rocks[i].position)) { Composite.remove(engine.world, rocks[i]); rocks.splice(i, 1); }
  for (let i = fluids.length - 1; i >= 0; i--) if (out(fluids[i].position)) { Composite.remove(engine.world, fluids[i]); fluids.splice(i, 1); }
  for (let i = arrows.length - 1; i >= 0; i--) if (out(arrows[i].position)) { Composite.remove(engine.world, arrows[i]); arrows.splice(i, 1); }
  for (let i = lines.length - 1; i >= 0; i--) if (lines[i].body.position.y > H + 400) { Composite.remove(engine.world, lines[i].body); lines.splice(i, 1); }
}
const out = p => p.y < -320 || p.y > H + 300 || p.x < -300 || p.x > W + 300;

/* ---------- Boucle physique ---------- */
function step(){
  if (state === "play") {
    for (const h of hives) while (h.spawned < h.count && simT >= h.delay + h.spawned * h.every) { spawnBee(h); h.spawned++; }
    const aimAt = {x: L.queen.x, y: L.queen.y - 60};
    for (const c of cannons) if (c.sweep) c.ang = c.ang0 + c.sweep.amp * Math.sin(simT * c.sweep.speed);
    for (const h of hives) if (h.swing) { h.x = h.x0 + h.swing.amp * Math.sin(simT * h.swing.speed); Body.setPosition(h.body, {x: h.x, y: h.y}); h.mouth.x = h.x + h.side * 14; }
    for (const b of bows) if (b.patrol) {
      b.x = b.x0 + b.patrol.range * Math.sin(simT * b.patrol.speed); b.pivot.x = b.x;
      Body.setPosition(b.body, {x: b.x, y: b.pivot.y + 8}); b.ang = Math.atan2(aimAt.y - b.pivot.y, aimAt.x - b.pivot.x);
    }
    for (const o of [...cannons, ...bows]) if (o.hidden && simT >= o.appear) {   // danger surprise !
      o.hidden = false; o.popT = t; Composite.add(engine.world, o.body);
      puff(o.x, o.y - 18, 14, "#e6d2b5"); Snd.pop(); shake = Math.max(shake, 5);
      bubble = {text: "Quoi ?!", until: t + 1.4};
    }
    for (const d of drops) if (!d.done && simT >= d.at) {
      d.done = true;
      const b = Bodies.polygon(d.x, -30, 8, d.r, {label:"rock", density:0.004, friction:0.6, frictionAir:0.004, restitution:0.1,
        collisionFilter:{category:CAT_ROCK, mask:CAT_WORLD | CAT_LINE | CAT_ROCK | CAT_BEE | CAT_LIQ}});
      Body.setVelocity(b, {x: 0, y: 3}); b.seed = rocks.length;
      Composite.add(engine.world, b); rocks.push(b); Snd.whistle();
    }
    if (L.fade && simT >= L.fade) for (const l of lines) if (!l.gone) {   // l'encre magique s'efface
      l.gone = true; Composite.remove(engine.world, l.body);
      for (const c of constraints) if (c.bodyB === l.body) Composite.remove(engine.world, c);
      const lb = l.body, ca = Math.cos(lb.angle - l.a0), sa = Math.sin(lb.angle - l.a0);
      for (let i = 0; i < l.pts.length; i += 4) { const q = l.pts[i]; puff(lb.position.x + q.x*ca - q.y*sa, lb.position.y + q.x*sa + q.y*ca, 1, INKS[lb.ink].col); }
      Snd.poof();
    }
    for (const c of cannons) if (!c.hidden && c.fired < c.count && simT >= c.delay + c.fired * c.every) { fireCannon(c); c.fired++; }
    for (const b of bows) if (!b.hidden && b.fired < b.count && simT >= b.delay + b.fired * b.every) { fireBow(b); b.fired++; }
    for (const e of emitters) while (e.from + e.n * e.rate <= Math.min(simT, e.to)) { emitFluid(e); e.n++; }
    for (const p of plats) if (p.def.breakAt && p.isStatic && simT >= p.def.breakAt) {
      Body.setStatic(p, false); Snd.crack(); puff(p.position.x, p.position.y, 12, "#e6d2b5"); shake = Math.max(shake, 6);
    }
    const survive = L.survive || 10, rem = survive - simT / 1000, sec = Math.ceil(rem);
    if (sec !== lastSecond) {
      lastSecond = sec; timerEl.textContent = Math.max(0, sec);
      if (sec <= 3 && sec > 0) { Snd.tick(); timerEl.classList.add("hot"); }
    }
    if (rem <= 0) win();
  }
  steer();
  Engine.update(engine, STEP);
  processStick();
  cleanup();
  simT += STEP;
  if (state === "play" && hives.length) {
    let near = 0; for (const b of bees) if (dist(b.body.position, queen.position) < 220) near++;
    Snd.buzzLevel(Math.min(0.06, 0.012 + near * 0.006));
  }
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function win(){
  if (state !== "play") return;
  state = "win"; endT = t; timerEl.hidden = true; timerEl.classList.remove("hot");
  Snd.stopBuzz(); Snd.win(); setTimeout(() => Snd.youpi(), 650);
  winStyle = "normal"; lastRare = null;
  if (Math.random() < 0.18) {           // fin rare !
    const R0 = RARE[Math.floor(Math.random() * RARE.length)];
    winStyle = R0.id; lastRare = {...R0, isNew: !save.rare[R0.id]}; save.rare[R0.id] = true; persist();
  }
  bubble = {text: lastRare ? lastRare.say : "Merci !", until: t + 99};
  const stars = starsFor(inkUsed);
  const prev = expert ? xstarsOf(cur) : starsOf(cur);
  const before = totalStars();
  if (stars > prev) { (expert ? save.xstars : save.stars)[cur + 1] = stars; }
  if (expert && stars > starsOf(cur)) save.stars[cur + 1] = stars;   // réussir en Expert valide aussi le mode normal
  persist();
  const after = totalStars();
  const fresh = COSTUMES.map((c, i) => i).filter(i => COSTUMES[i].need > before && COSTUMES[i].need <= after);
  for (let i = 0; i < 110; i++) confetti.push({
    x: Math.random()*W, y: -20 - Math.random()*300, vx: (Math.random()-.5)*2, vy: 1.5 + Math.random()*2.5,
    r: Math.random()*6, vr: (Math.random()-.5)*0.3, c: ["#ff5fa2","#ffc83d","#6c5ce7","#4cd3c2","#ff6b5b","#7bd85c"][i%6], w: 6 + Math.random()*5
  });
  setTimeout(() => showWin(stars, prev, fresh), 1300);
}
function lose(other){
  if (state !== "play") return;
  state = "fail"; endT = t; timerEl.hidden = true; timerEl.classList.remove("hot");
  shake = 14; Snd.stopBuzz(); Snd.ouch();
  const qc = failWho === "pet" && pet ? pet.position : queen.position, op = other ? other.position : qc;
  const dirx = Math.sign(qc.x - op.x) || 1;
  pows.push({x: Math.min(W - 60, Math.max(60, (qc.x + op.x) / 2)), y: Math.min(qc.y, op.y) - 10,
    text: {bee: "PIC !", rock: "BONK !", ball: "BOUM !", arrow: "TCHAK !", water: "SPLASH !", lava: "FSHHH !"}[failBy] || "AÏE !", t0: t});
  if (failWho === "queen" && (failBy === "rock" || failBy === "ball" || failBy === "arrow"))
    crownFly = {x: L.queen.x, y: L.queen.y - 78, vx: dirx * (2 + Math.random()), vy: -7.5, r: 0, vr: dirx * 0.25, arrow: failBy === "arrow"};
  if (failBy === "water") Snd.splash();
  if (failBy === "lava") Snd.sizzle();
  if (failBy === "ball" && failWho === "queen") lean = dirx * 0.28;
  timeScale = 0.18; slowUntil = t + 0.75;   // ralenti au moment du choc
  if (failWho === "pet") { bubble = {text: "Minou !!", until: t + 99}; setTimeout(showFail, 1900); return; }
  bubble = {text: {bee: "AÏE !!", rock: "Ouille…", ball: "Ma couronne !", arrow: "Hé, ma couronne !", water: "Toute mouillée…", lava: "Ça brûle !"}[failBy] || "AÏE !!", until: t + 99};
  setTimeout(showFail, 1900);
}

  if (lv.fluids && lv.fluids.some(f => f.kind === "water")) s += '<i class="w"></i>';

function showWardrobe(from){

function renderPreviews(){
  const main = ctx, dpr = view.dpr;
  overlay.querySelectorAll("canvas[data-p]").forEach(c => {
    const i = +c.dataset.p, w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return;
    if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    ctx = c.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height);
    const sc = Math.min(w / 72, h / 128) * dpr;
    ctx.setTransform(sc, 0, 0, sc, c.width / 2, c.height - 5 * dpr);
    drawQueen(0, 0, i === save.costume ? "happy" : "calm", {p: null, d: 1e9}, {costume: i, preview: true});
  });
  ctx = main;
}

window.addEventListener("resize", resize);

function ell(x, y, rx, ry, rot=0){ ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1,rx), Math.max(0.1,ry), rot, 0, Math.PI*2); }
function circ(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); }
function rrect(x, y, w, h, r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
const INK = "#2b2350";

const THEMES = {
  garden:   {sky: ["#5fb8ff", "#c9efff"], hill1: "#9fe08a", hill2: "#8ad673", grass: "#5cbf4a", dirt: "#b8794a", spot: "#a66a3d"},
  mountain: {sky: ["#7aa8ff", "#d8e6ff"], hill1: "#b9c3dd", hill2: "#a3aed0", grass: "#6fb84f", dirt: "#9a7a5e", spot: "#87684f"},
  castle:   {sky: ["#ff9fb8", "#ffe2c6"], hill1: "#c6a6e8", hill2: "#b293de", grass: "#5cbf4a", dirt: "#b8794a", spot: "#a66a3d"},
  volcano:  {sky: ["#6a4a8c", "#ffab7a"], hill1: "#7a5a6e", hill2: "#5e4458", grass: "#8c7a6b", dirt: "#5e4636", spot: "#4e3a2c"}
};

function drawBackground(x0, x1, y0, y1){
  const th = THEMES[L.theme] || THEMES.garden;
  const g = ctx.createLinearGradient(0, y0, 0, GROUND);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(x0, y0, x1 - x0, GROUND - y0 + 2);
  // soleil
  ctx.save(); ctx.translate(62, 120); ctx.rotate(t * 0.15);
  ctx.fillStyle = "#ffe48a";
  for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI/6); ctx.beginPath(); ctx.moveTo(30, -5); ctx.lineTo(44, 0); ctx.lineTo(30, 5); ctx.fill(); }
  ctx.restore();
  circ(62, 120, 26); ctx.fillStyle = "#ffd23f"; ctx.fill();
  // nuages
  const span = (x1 - x0) + 200;
  [[40, 230, 1], [210, 300, .8], [330, 90, .7]].forEach(([bx, by, sc], i) => {
    const x = x0 - 100 + ((bx - x0 + 100 + t * (6 + i*3)) % span + span) % span;
    ctx.fillStyle = "rgba(255,255,255,.9)";
    [[0,0,22],[22,-10,26],[46,0,20],[22,6,22]].forEach(([dx,dy,r]) => { circ(x + dx*sc, by + dy*sc, r*sc); ctx.fill(); });
  });
  // décor de fond
  if (L.theme === "mountain") {
    [[-40, 420, 170, th.hill2], [150, 380, 200, th.hill1], [330, 440, 160, th.hill2]].forEach(([mx, top, half, col]) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(mx - half, GROUND); ctx.lineTo(mx, top); ctx.lineTo(mx + half, GROUND); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(mx - half*0.22, top + 50); ctx.lineTo(mx, top); ctx.lineTo(mx + half*0.22, top + 50);
      ctx.lineTo(mx + 8, top + 40); ctx.lineTo(mx - 4, top + 52); ctx.closePath(); ctx.fill();
    });
  } else if (L.theme === "volcano") {
    ctx.fillStyle = th.hill2; ctx.beginPath(); ctx.moveTo(-20, GROUND); ctx.lineTo(150, 400); ctx.lineTo(240, 400); ctx.lineTo(420, GROUND); ctx.fill();
    ctx.fillStyle = "#ff6a1a"; ell(195, 401, 45, 7); ctx.fill();
    ctx.fillStyle = "#ffc83d"; ell(195, 400, 28, 4); ctx.fill();
    for (let k = 0; k < 4; k++) { const ph = (t * 0.25 + k / 4) % 1; ctx.fillStyle = `rgba(90,70,100,${0.5 * (1 - ph)})`; circ(195 + Math.sin(k * 2 + t) * 12, 390 - ph * 160, 14 + ph * 22); ctx.fill(); }
    ctx.fillStyle = th.hill1; ell(40, GROUND + 10, 150, 70); ctx.fill(); ell(370, GROUND + 15, 150, 80); ctx.fill();
  } else if (L.theme === "castle") {
    ctx.fillStyle = th.hill1;
    ctx.fillRect(60, 470, 280, GROUND - 470);
    for (let x = 60; x < 340; x += 28) ctx.fillRect(x, 456, 16, 16);
    [[70, 400], [330, 400], [200, 360]].forEach(([tx, ty]) => {
      ctx.fillStyle = th.hill2; ctx.fillRect(tx - 26, ty, 52, GROUND - ty);
      for (let k = -26; k < 26; k += 18) ctx.fillRect(tx + k, ty - 12, 11, 12);
      ctx.strokeStyle = th.hill2; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(tx, ty - 12); ctx.lineTo(tx, ty - 46); ctx.stroke();
      ctx.fillStyle = "#ff6b5b"; ctx.beginPath(); ctx.moveTo(tx, ty - 46); ctx.lineTo(tx + 20 + Math.sin(t*4 + tx)*3, ty - 40); ctx.lineTo(tx, ty - 33); ctx.fill();
      ctx.fillStyle = "rgba(43,35,80,.18)"; rrect(tx - 6, ty + 24, 12, 18, 6); ctx.fill();
    });
  } else {
    ctx.fillStyle = th.hill1; ell(60, GROUND + 10, 170, 90); ctx.fill();
    ctx.fillStyle = th.hill2; ell(360, GROUND + 20, 190, 110); ctx.fill();
  }
  // sol
  ctx.fillStyle = th.dirt; ctx.fillRect(x0, GROUND, x1 - x0, y1 - GROUND + 2);
  ctx.fillStyle = th.spot;
  for (let x = Math.floor(x0/40)*40; x < x1; x += 40) { circ(x + 14, GROUND + 40, 5); ctx.fill(); circ(x + 32, GROUND + 70, 3.5); ctx.fill(); }
  ctx.fillStyle = th.grass; ctx.fillRect(x0, GROUND - 2, x1 - x0, 18);
  ctx.beginPath(); ctx.moveTo(x0, GROUND + 16);
  for (let x = Math.floor(x0/16)*16; x <= x1 + 16; x += 16) ctx.quadraticCurveTo(x + 8, GROUND + 26, x + 16, GROUND + 16);
  ctx.lineTo(x1, GROUND); ctx.lineTo(x0, GROUND); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, GROUND - 1); ctx.lineTo(x1, GROUND - 1); ctx.stroke();
  // fleurs (évitent la reine et les canons)
  [[34,"#ff5fa2"],[96,"#ffffff"],[318,"#ffc83d"],[382,"#ff6b5b"]].forEach(([fx, col], i) => {
    if (Math.abs(fx - L.queen.x) < 40 && L.queen.y === GROUND) return;
    if (cannons.some(c => Math.abs(c.x - fx) < 36)) return;
    const sw = Math.sin(t*2 + i) * 2;
    ctx.strokeStyle = "#3f9a36"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(fx, GROUND); ctx.quadraticCurveTo(fx + 2, GROUND - 12, fx + sw, GROUND - 22); ctx.stroke();
    ctx.fillStyle = col; ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
    for (let k = 0; k < 5; k++) { const a = k * Math.PI*2/5 + t*0.3; circ(fx + sw + Math.cos(a)*5, GROUND - 22 + Math.sin(a)*5, 4.2); ctx.fill(); ctx.stroke(); }
    circ(fx + sw, GROUND - 22, 3.4); ctx.fillStyle = "#ffb100"; ctx.fill(); ctx.stroke();
  });
}

function drawPlatform(b){
  const p = b.def;
  ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
  const cracking = p.breakAt && b.isStatic && state === "play" && simT > p.breakAt - 900;
  if (cracking) ctx.translate((Math.random() - .5) * 2.5, (Math.random() - .5) * 1.5);
  const x = -p.w/2, y = -p.h/2;
  if (p.style === "earth") {
    const th = THEMES[L.theme] || THEMES.garden;
    rrect(x, y, p.w, p.h, 8); ctx.fillStyle = th.dirt; ctx.fill();
    ctx.save(); rrect(x, y, p.w, p.h, 8); ctx.clip();
    ctx.fillStyle = th.spot;
    for (let k = 0; k < p.w; k += 34) { circ(x + k + 12, y + 46 + (k % 68 ? 0 : 30), 5); ctx.fill(); circ(x + k + 26, y + 98 + (k % 68 ? 24 : 0), 3.5); ctx.fill(); }
    ctx.fillStyle = th.grass; ctx.fillRect(x, y, p.w, 16);
    ctx.beginPath(); ctx.moveTo(x, y + 16);
    for (let k = 0; k <= p.w; k += 16) ctx.quadraticCurveTo(x + k + 8, y + 26, x + k + 16, y + 16);
    ctx.lineTo(x + p.w, y); ctx.lineTo(x, y); ctx.fill();
    ctx.restore();
    rrect(x, y, p.w, p.h, 8); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
  } else if (p.style === "wood") {
    rrect(x, y, p.w, p.h, 6); ctx.fillStyle = "#c98a4b"; ctx.fill();
    ctx.strokeStyle = "#a96d34"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 6, 0); ctx.lineTo(x + p.w - 6, 0); ctx.stroke();
    ctx.fillStyle = INK; for (let k = x + 14; k < x + p.w; k += 46) { circ(k, y + 5, 1.6); ctx.fill(); circ(k, -y - 5, 1.6); ctx.fill(); }
    rrect(x, y, p.w, p.h, 6); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
    if (p.breakAt && (cracking || !b.isStatic)) {
      ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-6, y); ctx.lineTo(2, -2); ctx.lineTo(-4, 3); ctx.lineTo(4, -y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.w*0.25, y); ctx.lineTo(p.w*0.25 + 6, 1); ctx.stroke();
    }
  } else {
    rrect(x, y, p.w, p.h, 5); ctx.fillStyle = "#cfc6e0"; ctx.fill();
    ctx.save(); rrect(x, y, p.w, p.h, 5); ctx.clip();
    ctx.strokeStyle = "#aea4c7"; ctx.lineWidth = 2;
    for (let yy = y + 12, row = 0; yy < y + p.h; yy += 12, row++) { ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + p.w, yy); ctx.stroke(); }
    for (let yy = y, row = 0; yy < y + p.h; yy += 12, row++) for (let xx = x + (row % 2 ? 10 : 22); xx < x + p.w; xx += 24) { ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx, yy + 12); ctx.stroke(); }
    ctx.restore();
    rrect(x, y, p.w, p.h, 5); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
  }
  ctx.restore();
}

function drawAnchor(a){
  if (!a.line && (state === "draw" || state === "title" || state === "map")) {
    const flash = t < anchorFlash;
    ctx.save(); ctx.setLineDash([4, 4]); ctx.lineDashOffset = -t * 10;
    circ(a.x, a.y, 16 + Math.sin(t * 5) * 2); ctx.strokeStyle = flash && Math.sin(t * 25) > 0 ? "#ff5e57" : "#e0a020"; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
    star(a.x, a.y - 26, 6, t * 1.5); ctx.fillStyle = "#ffc83d"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
  }
  circ(a.x, a.y, 6); ctx.fillStyle = "#c8c3d8"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(a.x - 3, a.y); ctx.lineTo(a.x + 3, a.y); ctx.moveTo(a.x, a.y - 3); ctx.lineTo(a.x, a.y + 3); ctx.lineWidth = 1.5; ctx.stroke();
}
function drawWarn(x){
  if (Math.sin(t * 18) < -0.3) return;
  const y = 112;   // sous le compte à rebours
  ctx.save(); ctx.setLineDash([4, 6]); ctx.strokeStyle = "rgba(232,52,78,.7)"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(x, y + 14); ctx.lineTo(x, y + 60); ctx.stroke(); ctx.restore();
  ctx.beginPath(); ctx.moveTo(x, y - 13); ctx.lineTo(x + 13, y + 10); ctx.lineTo(x - 13, y + 10); ctx.closePath();
  ctx.fillStyle = "#ffc83d"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.stroke();
  ctx.fillStyle = INK; ctx.fillRect(x - 1.6, y - 5, 3.2, 8); circ(x, y + 6, 1.8); ctx.fill();
}
function drawZone(z, r){
  ctx.save();
  circ(z.x, z.y, r); ctx.fillStyle = "rgba(255,94,87,.12)"; ctx.fill();
  ctx.setLineDash([7, 6]); ctx.lineDashOffset = -t * 12; ctx.strokeStyle = "#ff5e57"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.setLineDash([]);
  circ(z.x + r * 0.7, z.y - r * 0.7, 8); ctx.fillStyle = "#ff5e57"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.fillRect(z.x + r * 0.7 - 4.5, z.y - r * 0.7 - 1.3, 9, 2.6);
  ctx.restore();
}
function moveHint(x0, x1, y){
  ctx.save(); ctx.setLineDash([5, 6]); ctx.strokeStyle = "rgba(43,35,80,.45)"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "rgba(43,35,80,.55)";
  for (const [ax, d] of [[x0, -1], [x1, 1]]) { ctx.beginPath(); ctx.moveTo(ax + d * 8, y); ctx.lineTo(ax - d * 2, y - 6); ctx.lineTo(ax - d * 2, y + 6); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function drawHive(h){
  const {x, y} = h;
  const fromRight = x > W/2;
  const ex = fromRight ? W + 60 : -60;
  ctx.lineCap = "round";
  if (h.swing) {   // ruche suspendue à une corde
    if (state === "draw") moveHint(h.x0 - h.swing.amp, h.x0 + h.swing.amp, y - 96);
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(h.x0, -60); ctx.lineTo(x, y - 44); ctx.stroke();
    ctx.strokeStyle = "#c98a4b"; ctx.lineWidth = 2; ctx.stroke();
  } else {
    ctx.strokeStyle = INK; ctx.lineWidth = 13; ctx.beginPath(); ctx.moveTo(ex, y - 70); ctx.quadraticCurveTo(x + (fromRight ? 40 : -40), y - 58, x + (fromRight ? -40 : 40), y - 64); ctx.stroke();
    ctx.strokeStyle = "#8a5a35"; ctx.lineWidth = 8; ctx.stroke();
    ctx.fillStyle = "#6fcf5a"; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ell(x - 30, y - 74, 11, 6, -0.5); ctx.fill(); ctx.stroke(); ell(x + 46, y - 72, 11, 6, 0.4); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y - 62); ctx.lineTo(x, y - 44); ctx.stroke();
  }
  const rows = [[-30, 22], [-15, 30], [0, 34], [15, 31], [29, 23]];
  for (const [dy, rx] of rows) { ell(x, y + dy, rx, 11); ctx.fillStyle = "#f6b23f"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke(); }
  ctx.fillStyle = "rgba(255,255,255,.35)"; ell(x - 12, y - 18, 6, 10, 0.4); ctx.fill();
  ell(h.mouth.x, h.mouth.y - 6, 9, 6.5); ctx.fillStyle = "#3a2312"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
}

function drawCannon(c){
  if (c.hidden) return;
  const k = c.popT ? Math.min(1, (t - c.popT) / 0.3) : 1;
  if (k < 1) { ctx.save(); ctx.translate(c.x, c.y); ctx.scale(k, k); ctx.translate(-c.x, -c.y); drawCannonBody(c); ctx.restore(); }
  else drawCannonBody(c);
}
function drawCannonBody(c){
  const {x, y} = c, P = c.pivot;
  c.recoil *= 0.9;
  if (c.sweep && state === "draw") {   // montre l'angle de balayage
    ctx.save(); ctx.setLineDash([5, 7]); ctx.strokeStyle = "rgba(43,35,80,.4)"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    for (const a of [c.ang0 - c.sweep.amp, c.ang0 + c.sweep.amp]) { ctx.beginPath(); ctx.moveTo(P.x + Math.cos(a) * 50, P.y + Math.sin(a) * 50); ctx.lineTo(P.x + Math.cos(a) * 150, P.y + Math.sin(a) * 150); ctx.stroke(); }
    ctx.setLineDash([]); ctx.beginPath(); ctx.arc(P.x, P.y, 120, c.ang0 - c.sweep.amp, c.ang0 + c.sweep.amp); ctx.stroke();
    ctx.restore();
  }
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(c.ang); ctx.translate(-c.recoil * 9, 0);
  ctx.lineJoin = "round";
  rrect(-16, -11, 52, 22, 9); ctx.fillStyle = "#3b3550"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
  rrect(30, -13, 10, 26, 4); ctx.fillStyle = "#4a4466"; ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#ffc83d"; ctx.fillRect(4, -11, 5, 22); ctx.strokeRect(4, -11, 5, 22);
  ctx.fillStyle = "rgba(255,255,255,.25)"; rrect(-10, -8, 36, 4, 2); ctx.fill();
  // mèche qui grésille juste avant le tir
  const nextAt = c.delay + c.fired * c.every;
  if (state === "play" && c.fired < c.count && nextAt - simT < 700) {
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-16, -4); ctx.lineTo(-24, -12); ctx.stroke();
    const fl = 3 + Math.random() * 3;
    circ(-25, -13, fl); ctx.fillStyle = Math.random() < .5 ? "#ffc83d" : "#ff6b5b"; ctx.fill();
  }
  ctx.restore();
  // affût
  ctx.fillStyle = "#b0773f"; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(x - 22, y - 2); ctx.lineTo(x - 14, y - 26); ctx.lineTo(x + 14, y - 26); ctx.lineTo(x + 22, y - 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  circ(x, y - 12, 12); ctx.fillStyle = "#8a5a35"; ctx.fill(); ctx.stroke();
  ctx.lineWidth = 2; for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; ctx.beginPath(); ctx.moveTo(x - Math.cos(a)*11, y - 12 - Math.sin(a)*11); ctx.lineTo(x + Math.cos(a)*11, y - 12 + Math.sin(a)*11); ctx.stroke(); }
  circ(x, y - 12, 3.5); ctx.fillStyle = INK; ctx.fill();
}

function drawRock(b){
  const v = b.vertices;
  ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y);
  for (let i = 1; i < v.length; i++) ctx.quadraticCurveTo(v[i].x, v[i].y, (v[i].x + v[(i+1)%v.length].x)/2, (v[i].y + v[(i+1)%v.length].y)/2);
  ctx.closePath();
  ctx.fillStyle = "#a39dae"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.stroke();
  const r = b.circleRadius || dist(v[0], b.position);
  ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
  ctx.fillStyle = "#c4bfcd"; ell(-r*0.3, -r*0.32, r*0.32, r*0.2, -0.4); ctx.fill();
  ctx.fillStyle = "#857f93"; circ(r*0.3, r*0.25, r*0.12); ctx.fill(); circ(-r*0.15, r*0.4, r*0.08); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(r*0.15, -r*0.6); ctx.lineTo(r*0.05, -r*0.25); ctx.lineTo(r*0.3, -r*0.05); ctx.stroke();
  ctx.restore();
}
function drawBall(b){
  const {x, y} = b.position;
  circ(x, y, 9.5); ctx.fillStyle = "#2f2a44"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  circ(x - 3, y - 3, 2.6); ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fill();
  if (!b.hit) { const v = b.velocity, s = Math.hypot(v.x, v.y) || 1;
    ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 3; ctx.lineCap = "round";
    for (let k = 1; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(x - v.x/s*(12 + k*6), y - v.y/s*(12 + k*6) + (k-1.5)*7); ctx.lineTo(x - v.x/s*(20 + k*8), y - v.y/s*(20 + k*8) + (k-1.5)*7); ctx.stroke(); } }
}

function strokePath(list){
  ctx.beginPath(); ctx.moveTo(list[0].x, list[0].y);
  for (let i = 1; i < list.length; i++) ctx.lineTo(list[i].x, list[i].y);
}
function drawInk(list, I = INKS.normal){
  if (list.length < 2) { if (list.length) { circ(list[0].x, list[0].y, LINE_W/2); ctx.fillStyle = I.col; ctx.fill(); } return; }
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (I !== INKS.normal) { strokePath(list); ctx.strokeStyle = INK; ctx.lineWidth = LINE_W + 3; ctx.stroke(); }
  strokePath(list); ctx.strokeStyle = I.col; ctx.lineWidth = LINE_W; ctx.stroke();
  ctx.save(); ctx.translate(-1.2, -1.6); if (I.bouncy) ctx.setLineDash([5, 7]);
  strokePath(list); ctx.strokeStyle = I.hi; ctx.lineWidth = LINE_W * 0.3; ctx.stroke(); ctx.restore();
  if (I.sticky) { ctx.fillStyle = I.col; for (let i = 3; i < list.length; i += 6) { ell(list[i].x, list[i].y + 6, 2.6, 3.6); ctx.fill(); } }
}
function drawPencil(p){
  // le crayon raccourcit à mesure que l'encre s'épuise
  const len = 8 + 36 * Math.max(0, 1 - inkUsed / L.ink), e = 12 + len;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(-0.75);
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(12, -6); ctx.lineTo(12, 6); ctx.closePath(); ctx.fillStyle = "#f5d2a0"; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(4, -2); ctx.lineTo(4, 2); ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
  ctx.fillStyle = "#ffc83d"; ctx.fillRect(12, -6, len, 12); ctx.strokeRect(12, -6, len, 12);
  ctx.fillStyle = "#c8c3d8"; ctx.fillRect(e, -6, 6, 12); ctx.strokeRect(e, -6, 6, 12);
  ctx.fillStyle = "#ff8fb8"; ctx.beginPath(); ctx.moveTo(e + 6, -6); ctx.lineTo(e + 12, -6); ctx.quadraticCurveTo(e + 16, 0, e + 12, 6); ctx.lineTo(e + 6, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawBee(bee){
  const {x, y} = bee.body.position, f = bee.face < 0 ? -1 : 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(f, 1);
  const flap = Math.abs(Math.sin(t * 55 + bee.phase));
