  if (C.antennae) {
    ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
    for (const sgn of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sgn * 12, -68); ctx.quadraticCurveTo(sgn * 18, -80, sgn * 23 + Math.sin(t * 4) * sgn, -86); ctx.stroke(); circ(sgn * 23 + Math.sin(t * 4) * sgn, -87, 3.2); ctx.fillStyle = INK; ctx.fill(); }
  }
  if (C.mask) { rrect(-17, -59, 34, 10, 5); ctx.fillStyle = C.mask; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke(); }

  ctx.fillStyle = stung ? "rgba(255,90,110,.55)" : "rgba(255,120,150,.5)";
  ell(-11, -47, 4.2, 2.6); ctx.fill(); ell(11, -47, 4.2, 2.6); ctx.fill();

  ctx.strokeStyle = INK; ctx.fillStyle = INK;
  const EY = -54;
  if (mood === "happy" && ws === "love") {
    for (const ex of [-7, 7]) { heart(ex, EY + 1, 6 + Math.sin(t * 10) * 0.8); ctx.fillStyle = "#e8344e"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.stroke(); }
  } else if (mood === "happy" && ws === "tongue") {
    ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(-7, EY + 2, 4.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ell(7, EY, 5.6, 6.8); ctx.fillStyle = "#fff"; ctx.fill(); ctx.lineWidth = 1.6; ctx.stroke(); circ(7, EY + 0.5, 3.2); ctx.fillStyle = INK; ctx.fill();
  } else if (mood === "happy") {
    ctx.lineWidth = 2.6;
    for (const ex of [-7, 7]) { ctx.beginPath(); ctx.arc(ex, EY + 2, 4.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  } else if (stung) {
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-11, EY - 3); ctx.lineTo(-5, EY); ctx.lineTo(-11, EY + 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(11, EY - 3); ctx.lineTo(5, EY); ctx.lineTo(11, EY + 3); ctx.stroke();
    ctx.fillStyle = "rgba(90,180,255,.85)";
    const tl = Math.min(14, (t - endT) * 22);
    rrect(-11, EY + 3, 3.4, tl, 1.7); ctx.fill();
    rrect(7.6, EY + 3, 3.4, tl, 1.7); ctx.fill();
  } else {
    const big = mood === "panic" || mood === "sad";
    const blink = mood === "calm" && (t % 3.6) < 0.13;
    for (const ex of [-7, 7]) {
      if (blink) { ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(ex - 4, EY); ctx.lineTo(ex + 4, EY); ctx.stroke(); continue; }
      ell(ex, EY, big ? 6 : 5.2, big ? 7.4 : 6.3); ctx.fillStyle = "#fff"; ctx.fill(); ctx.lineWidth = 1.6; ctx.stroke();
      const pr = big ? 2.1 : 3.5, m = big ? 2.6 : 1.6;
      circ(ex + look.x * m, EY + look.y * m + 0.5, pr); ctx.fillStyle = INK; ctx.fill();
      circ(ex + look.x * m - 1.1, EY + look.y * m - 1, big ? 0.8 : 1.3); ctx.fillStyle = "#fff"; ctx.fill();
    }
    if (mood !== "calm") {
      const by = big ? -66 : -63; ctx.lineWidth = 2.2; ctx.strokeStyle = INK;
      ctx.beginPath(); ctx.moveTo(-12, by + 2); ctx.lineTo(-4, by - 1.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12, by + 2); ctx.lineTo(4, by - 1.5); ctx.stroke();
    }
  }
  if (mood === "sad") {
    ctx.fillStyle = "rgba(90,180,255,.85)"; const tl = Math.min(16, (t - endT) * 20);
    rrect(-11, EY + 5, 3.4, tl, 1.7); ctx.fill(); rrect(7.6, EY + 5, 3.4, tl, 1.7); ctx.fill();
  }
  if (C.patch) {
    ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-18, -62); ctx.lineTo(3, -57); ctx.moveTo(12, -57); ctx.lineTo(18, -60); ctx.stroke();
    ell(7.5, -54, 6.2, 6.6); ctx.fillStyle = INK; ctx.fill();
  }

  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  if (mood === "calm") { ctx.beginPath(); ctx.arc(0, -46.5, 3.6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  else if (mood === "worried") { ctx.beginPath(); ctx.moveTo(-3.5, -42.5); ctx.quadraticCurveTo(-1.5, -45, 0, -43.5); ctx.quadraticCurveTo(1.5, -42, 3.5, -44); ctx.stroke(); }
  else if (mood === "panic") {
    ell(0, -42.5, 3.6, 4.6 + Math.sin(t * 30) * 0.6); ctx.fillStyle = "#5b1830"; ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#9ee1ff"; ctx.strokeStyle = INK; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(19, -70); ctx.quadraticCurveTo(24, -62, 19, -59); ctx.quadraticCurveTo(14, -62, 19, -70); ctx.fill(); ctx.stroke();
  }
  else if (mood === "sad") { ctx.beginPath(); ctx.arc(0, -39, 5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
  else if (mood === "happy" && ws === "tongue") {
    ctx.beginPath(); ctx.moveTo(-5, -45); ctx.quadraticCurveTo(0, -43, 5, -45); ctx.stroke();
    rrect(-3.6, -45, 7.2, 10 + Math.sin(t * 12) * 1.5, 3.6); ctx.fillStyle = "#ff6f91"; ctx.fill(); ctx.lineWidth = 1.6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -43); ctx.lineTo(0, -38); ctx.stroke();
  }
  else if (mood === "happy") { ctx.beginPath(); ctx.arc(0, -46, 6, 0, Math.PI); ctx.closePath(); ctx.fillStyle = "#5b1830"; ctx.fill(); ctx.stroke(); ell(0, -42.2, 3, 1.6); ctx.fillStyle = "#ff8fa8"; ctx.fill(); }
  else if (stung) {
    ctx.beginPath(); ctx.moveTo(-5, -40); for (let i = 1; i <= 4; i++) ctx.lineTo(-5 + i * 2.5, -40 + (i % 2 ? -1.8 : 0)); ctx.stroke();
    const sw = Math.min(1, (t - endT) * 4);
    if (failBy === "bee") {
      circ(0, -48.5, 2 + 4.2 * sw); ctx.fillStyle = "#ff4d5e"; ctx.fill(); ctx.lineWidth = 1.8; ctx.stroke();
      circ(-1.6, -50.4, 1.4 * sw); ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.fill();
    } else if (failBy === "water") {
      // trempée : gouttes qui tombent et flaque
      ctx.fillStyle = "#6cc4ff"; ctx.strokeStyle = INK; ctx.lineWidth = 1.2;
      [-21, -13, 13, 22, 0].forEach((dx, k) => { const ph = (t * 1.4 + k * 0.27) % 1, yy = -64 + ph * 60;
        ctx.beginPath(); ctx.moveTo(dx, yy - 5); ctx.quadraticCurveTo(dx + 3.5, yy + 1, dx, yy + 3); ctx.quadraticCurveTo(dx - 3.5, yy + 1, dx, yy - 5); ctx.fill(); ctx.stroke(); });
      ctx.fillStyle = "rgba(63,169,245,.55)"; ell(0, 1, 22 + 12 * sw, 4); ctx.fill();
    } else if (failBy === "lava") {
      // suie sur le visage et la robe
      ctx.fillStyle = "rgba(45,35,40,.72)";
      ell(-9, -50, 6, 4.5, 0.3); ctx.fill(); ell(10, -60, 5, 3.5, -0.3); ctx.fill(); ell(5, -44, 4, 2.5); ctx.fill();
      ell(-8, -14, 7, 5); ctx.fill(); ell(10, -24, 5, 4); ctx.fill();
    } else {
      // bosse sur le front
      circ(9, -66, 1 + 5 * sw); ctx.fillStyle = "#ff9aa8"; ctx.fill(); ctx.lineWidth = 1.8; ctx.stroke();
    }
    if (failBy !== "water" && failBy !== "lava") for (let i = 0; i < 3; i++) { const a = t * 4 + i * Math.PI * 2 / 3; star(Math.cos(a) * 20, -88 + Math.sin(a) * 5, 4.5, a); ctx.fillStyle = "#ffc83d"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.stroke(); }
  }

  let arms = {
    sad: [[-15, -52], [15, -52]],
    calm: [[-17, -22], [17, -22]], worried: [[-6, -29], [6, -29]], panic: [[-17, -55], [17, -55]],
    happy: [[-26, -66 + Math.sin(t*14)*3], [26, -66 - Math.sin(t*14)*3]], stung: [[-19, -24], [9, -49]]
  }[mood] || [[-17, -22], [17, -22]];
  if (ws === "dance") arms = Math.sin(t * 7) > 0 ? [[-26, -68], [20, -26]] : [[-20, -26], [26, -68]];
  else if (ws === "bow") arms = [[-26, -18], [6, -36]];
  else if (ws === "tongue") arms = [[-21, -57 + Math.sin(t * 20) * 2], [21, -57 - Math.sin(t * 20) * 2]];
  else if (ws === "love") arms = [[-4, -38], [4, -38]];
  [[-10, -34], [10, -34]].forEach(([sx, sy], i) => {
    const [hx, hy] = arms[i];
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.stroke();
    ctx.strokeStyle = DRESS; ctx.lineWidth = 4.5; ctx.stroke();
    circ(hx, hy, 4.3); ctx.fillStyle = SKIN; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.stroke();
  });
  if (C.helmet) {
    rrect(-14, -40, 28, 6, 3); ctx.fillStyle = "#c8cee3"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    circ(0, -61, 31); ctx.fillStyle = "rgba(190,230,255,.22)"; ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -61, 25, Math.PI * 1.1, Math.PI * 1.4); ctx.stroke();
  }
  if (C.sparkle && !stung) {
    for (let k = 0; k < 3; k++) { const a = (t * 1.3 + k * 0.33) % 1;
      ctx.globalAlpha = Math.sin(a * Math.PI); star([-28, 26, -22][k], [-70, -40, -18][k], 3 + 3 * a, 0); ctx.fillStyle = "#fff3a0"; ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawBubble(text, x, y){
  ctx.font = '22px "Gochi Hand", "Comic Sans MS", cursive';
  const w = ctx.measureText(text).width + 22, h = 34;
  const flip = x + w > W - 6;
  let bx = flip ? x - 44 - w : x, by = y - h;
  bx = Math.min(W - w - 6, Math.max(6, bx));
  rrect(bx, by, w, h, 14);
  ctx.fillStyle = "#fff"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
  const tx = flip ? bx + w - 14 : bx + 14, tip = flip ? bx + w - 4 : bx + 4;
  ctx.beginPath(); ctx.moveTo(tx - 6, by + h - 1.5); ctx.lineTo(tip, by + h + 12); ctx.lineTo(tx + 6, by + h - 1.5); ctx.closePath(); ctx.fillStyle = "#fff"; ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 6, by + h); ctx.lineTo(tip, by + h + 12); ctx.lineTo(tx + 6, by + h); ctx.stroke();
  ctx.fillStyle = INK; ctx.textBaseline = "middle"; ctx.fillText(text, bx + 11, by + h/2 + 2);
}

function render(){
  const {s, ox, oy, cw, ch, dpr} = view;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#86cfff"; ctx.fillRect(0, 0, cv.width, cv.height);
  let sx = 0, sy = 0;
  if (shake > 0.3) { sx = (Math.random() - .5) * shake; sy = (Math.random() - .5) * shake; shake *= 0.88; } else shake = 0;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (ox + sx), dpr * (oy + sy));
  const x0 = -ox / s - 20, x1 = (cw - ox) / s + 20, y0 = -oy / s - 20, y1 = (ch - oy) / s + 20;

  drawBackground(x0, x1, y0, y1);
  if (L.wind) drawWind();
  for (const h of hives) drawHive(h);
  for (const b of bows) drawBow(b);
  for (const p of plats) drawPlatform(p);
  for (const c of cannons) drawCannon(c);
  if (state === "draw") for (const z of noDrawZones()) drawZone(z, L.noDrawR);
  if (state === "draw" && ghosts[cur] && strokesLeft === (L.strokes || 1)) for (const g of ghosts[cur]) drawGhost(g);
  const fadeLeft = L.fade && state !== "draw" ? L.fade - simT : 1e9;
  for (const l of lines) {
    if (l.gone) continue;
    const lb = l.body;
    if (fadeLeft < 1500) ctx.globalAlpha = (0.35 + 0.65 * Math.abs(Math.cos(t * 9))) * Math.max(0.15, fadeLeft / 1500);
    ctx.save(); ctx.translate(lb.position.x, lb.position.y); ctx.rotate(lb.angle - l.a0);
    drawInk(l.pts, INKS[lb.ink]); ctx.restore();
    ctx.globalAlpha = 1;
    if (l.stuck.length) {
      ctx.save(); ctx.translate(lb.position.x, lb.position.y); ctx.rotate(lb.angle);
      for (const s of l.stuck) { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a); ctx.translate(-6, 0); drawArrowShape(); ctx.restore(); }
      ctx.restore();
    }
  }
  if (pts.length) drawInk(pts, INKS[inkType]);
  for (const a of anchors) drawAnchor(a);
  if (state === "play") for (const d of drops) if (!d.done && d.at - simT < 1100) drawWarn(d.x);

  const nt = nearestThreat();
  const mood = queenMood(nt);
  if (mood === "panic" && prevMood !== "panic" && t - lastEek > 1.5) { lastEek = t; Snd.eek(); }
  prevMood = mood;
  drawQueen(L.queen.x, L.queen.y, mood, nt);
  if (pet) drawPet(L.pet.x, L.pet.y, petMood());
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, f.life);
    if (f.kind === "heart") { heart(f.x, f.y, 7); ctx.fillStyle = "#ff5fa2"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke(); }
    else { ctx.font = '800 22px "Baloo 2", sans-serif'; ctx.fillStyle = INK; ctx.fillText("♪", f.x, f.y); }
  }
  ctx.globalAlpha = 1;
  for (const r of rocks) drawRock(r);
  for (const b of balls) drawBall(b);
  for (const a of arrows) { ctx.save(); ctx.translate(a.position.x, a.position.y); ctx.rotate(a.angle); drawArrowShape(); ctx.restore(); }
  drawFluids();
  for (const e of emitters) drawPipe(e);
  for (const b of bees) drawBee(b);

  for (const p of smoke) { circ(p.x, p.y, p.r * (1.6 - p.life * 0.6)); ctx.fillStyle = `rgba(255,255,255,${p.life * 0.75})`; ctx.fill(); }

  for (const p of dust) { ctx.globalAlpha = Math.max(0, p.life) * 0.85; circ(p.x, p.y, p.r * (1.4 - p.life * 0.4)); ctx.fillStyle = p.col; ctx.fill(); }
  ctx.globalAlpha = 1;
  if (crownFly) {
    ctx.save(); ctx.translate(crownFly.x, crownFly.y); ctx.rotate(crownFly.r);
    ctx.save(); ctx.translate(0, 79); drawCrown(); ctx.restore();
    if (crownFly.arrow) { ctx.rotate(0.5); drawArrowShape(); }
    ctx.restore();
  }
  for (const pw of pows) drawPow(pw);
  if (drawing && pts.length) drawPencil(pts[pts.length - 1]);
  if (blockMark && t < blockMark.until) {
    const k = (blockMark.until - t) / 0.7;
    ctx.globalAlpha = Math.min(1, k * 2);
    circ(blockMark.x, blockMark.y, 11); ctx.fillStyle = "#ff5e57"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(blockMark.x - 4.5, blockMark.y - 4.5); ctx.lineTo(blockMark.x + 4.5, blockMark.y + 4.5);
    ctx.moveTo(blockMark.x + 4.5, blockMark.y - 4.5); ctx.lineTo(blockMark.x - 4.5, blockMark.y + 4.5); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  let bt = bubble && t < bubble.until ? bubble.text : null;
  if (!bt && state === "play" && mood === "panic") bt = "Aaah !";
  if (bt && (state === "draw" || state === "play" || state === "win" || state === "fail")) drawBubble(bt, L.queen.x + 22, L.queen.y - 98);

  for (const c of confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-c.w/2, -3, c.w, 6); ctx.restore();
  }
}

let last = performance.now(), acc = 0;
function frame(now){
  const dt = Math.min(50, now - last); last = now; t += dt / 1000;
  if (state === "play" || state === "win" || state === "fail") {
    if (timeScale < 1 && t > slowUntil) timeScale = Math.min(1, timeScale + dt / 500);
    acc += dt * timeScale;
    while (acc >= STEP) { step(); acc -= STEP; }
  } else acc = 0;
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i]; c.x += c.vx + Math.sin(t * 3 + i) * 0.6; c.y += c.vy; c.r += c.vr;
    if (c.y > GROUND + 10) confetti.splice(i, 1);
  }
  for (let i = smoke.length - 1; i >= 0; i--) {
    const p = smoke[i]; p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt / 900;
    if (p.life <= 0) smoke.splice(i, 1);
  }
  for (let i = dust.length - 1; i >= 0; i--) {
    const p = dust[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.95; p.life -= dt / 700;
    if (p.life <= 0) dust.splice(i, 1);
  }
  if (crownFly) {
    const c = crownFly, k = timeScale;
    c.vy += 0.4 * k; c.x += c.vx * k; c.y += c.vy * k; c.r += c.vr * k;
    const floor = (Math.abs(c.x - L.queen.x) < 50 ? L.queen.y : GROUND) - 6;
    if (c.y > floor) {
      c.y = floor;
      if (Math.abs(c.vy) > 1.2) { c.vy *= -0.45; c.vx *= 0.7; c.vr *= 0.6; Snd.clink(); }
      else { c.vy = 0; c.vx *= 0.85; c.vr *= 0.8; }
    }
  }
  if (state === "win" && (winStyle === "dance" || winStyle === "love") && Math.random() < 0.09)
    floaters.push({x: L.queen.x + (Math.random() - .5) * 60, y: L.queen.y - 70, vx: (Math.random() - .5) * .6, life: 1, kind: winStyle === "love" ? "heart" : "note"});
  for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.y -= 0.9; f.x += f.vx + Math.sin(t * 4 + i) * 0.4; f.life -= dt / 1800; if (f.life <= 0) floaters.splice(i, 1); }
  if (state === "fail" && failWho === "queen" && failBy === "lava" && Math.random() < 0.2)
    smoke.push({x: L.queen.x + (Math.random() - .5) * 24, y: L.queen.y - 82, vx: (Math.random() - .5) * .5, vy: -0.9 - Math.random() * .6, r: 4 + Math.random() * 3, life: 1});
  render();
  if (state === "wardrobe") renderPreviews();
  tickDrawClock(dt);
  requestAnimationFrame(frame);
}

/* ---------- Démarrage ---------- */
resize(); paintSound();
const firstOpen = Math.max(0, LEVELS.findIndex((_, i) => unlocked(i) && !starsOf(i)));
buildLevel(firstOpen); updateInkUI(); showTitle();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
})();
</script>

</body>
</html>
